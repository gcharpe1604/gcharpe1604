name: Update profile visuals

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Generate dark contribution statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide=stars&include_all_commits=true&show=reviews,prs_merged&hide_border=true&bg_color=00000000&title_color=AFC3D5&text_color=D6DCE3&icon_color=D1B178&custom_title=Contribution%20Statistics
          path: dist/github-stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate light contribution statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide=stars&include_all_commits=true&show=reviews,prs_merged&hide_border=true&bg_color=00000000&title_color=4E708F&text_color=334155&icon_color=A47A3C&custom_title=Contribution%20Statistics
          path: dist/github-stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#B28A50
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#D1B178

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}