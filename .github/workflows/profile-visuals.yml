name: Update profile visuals

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create output directory
        run: mkdir -p assets/profile

      - name: Generate dark contribution statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide=stars&include_all_commits=true&show=reviews,prs_merged&hide_border=true&bg_color=00000000&title_color=AFC3D5&text_color=D6DCE3&icon_color=D1B178&custom_title=Contribution%20Statistics
          path: assets/profile/github-stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate light contribution statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide=stars&include_all_commits=true&show=reviews,prs_merged&hide_border=true&bg_color=00000000&title_color=4E708F&text_color=334155&icon_color=A47A3C&custom_title=Contribution%20Statistics
          path: assets/profile/github-stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/profile/github-contribution-grid-snake.svg?palette=github-light&color_snake=#B28A50
            assets/profile/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#D1B178

      - name: Commit generated visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/*.svg
          git diff --cached --quiet || git commit -m "chore(profile): update contribution visuals"
          git push